# LegalOS -> http://zameenpkreports.com/legalos   (node server.js on :4600)
#
# The trailing slash on proxy_pass STRIPS the /legalos prefix, so the app serves
# its tree from the root as it does in local dev. Nothing in the app hardcodes
# either form: every asset, script and cross-app link is RELATIVE, and in-app
# navigation is hash-based (#/exec, #/requests), so deep links need no rewrite
# and no SPA fallback at the nginx layer.
#
# The `location = /legalos` redirect is REQUIRED, not cosmetic: without the
# trailing slash the browser resolves the page's relative assets against "/"
# and every asset 404s. server.js does the same for directory URLs such as
# /legalos/portal, using a relative Location so the redirect stays inside the
# mount point.
#
# Cf-Access-* is forwarded for consistency with the other dashboards. This
# prototype does not read it (its sign-in is a demo persona picker), so
# Cloudflare Access is the ONLY thing gating who reaches it — see DEPLOY.md.
location = /legalos { return 301 /legalos/; }
location /legalos/ {
    proxy_pass         http://127.0.0.1:4600/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header   Cf-Access-Jwt-Assertion            $http_cf_access_jwt_assertion;
    proxy_set_header   Cf-Ray                             $http_cf_ray;
    proxy_set_header   Connection        "";
    proxy_read_timeout 120s;
    proxy_buffering    off;
}
