# LegalOS -> http://zameenpkreports.com/legalos   (node server.js on :4600)
#
# The trailing slash on proxy_pass STRIPS the /legalos prefix, so the app serves
# its tree from the root as it does in local dev. Nothing in the app hardcodes
# either form: every asset, script and cross-app link is RELATIVE, and in-app
# navigation is hash-based (#/exec, #/requests), so deep links need no rewrite
# and no SPA fallback at the nginx layer.
#
# The `location = /legalos` redirect is REQUIRED, not cosmetic: without the
# trailing slash the browser resolves the page's relative assets against "/"
# and every asset 404s. server.js does the same for directory URLs such as
# /legalos/portal, using a relative Location so the redirect stays inside the
# mount point.
#
# Cf-Access-* is forwarded because the app now VERIFIES it: api/access.js checks
# the RS256 signature, aud and iss of Cf-Access-Jwt-Assertion against
# Cloudflare's public keys. The plaintext Cf-Access-Authenticated-User-Email
# header is never trusted on its own — a request that supplies only that header
# is treated as anonymous (verified: it returns 401).
#
# ORIGIN EXPOSURE — READ deploy/harden-origin.md
# ----------------------------------------------
# This box answers on its public IP with a spoofed Host header, so /legalos/ is
# reachable WITHOUT passing Cloudflare Access. That is contained but not ideal:
#   • every /api/* route returns 401 without a verified CF assertion or a
#     LegalOS session cookie, so no legal data is exposed;
#   • but the static SPA shell and /api/auth/login are internet-facing. The
#     login carries scrypt hashing and a per-(ip,account) lockout after 5 tries
#     (verified: the 6th attempt returns 429 for ~15 minutes, and a CORRECT
#     password is refused while the lockout holds).
# To close it properly, restrict this vhost to Cloudflare's published ranges —
# see deploy/harden-origin.md. That edits a SHARED nginx file and needs root.
location = /legalos { return 301 /legalos/; }
location /legalos/ {
    proxy_pass         http://127.0.0.1:4600/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header   Cf-Access-Jwt-Assertion            $http_cf_access_jwt_assertion;
    proxy_set_header   Cf-Ray                             $http_cf_ray;
    proxy_set_header   Connection        "";
    proxy_read_timeout 120s;
    proxy_buffering    off;
}
